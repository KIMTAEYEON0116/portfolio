# nginx — 80번 포트로 들어온 요청을 내부의 FastAPI(127.0.0.1:8000)로 넘긴다
# 설치: sudo cp deploy/nginx-portfolio.conf /etc/nginx/sites-available/portfolio
#       sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#       sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
# 도메인을 연결하면 server_name 의 _ 를 도메인으로 바꾸고 certbot 으로 HTTPS 를 붙인다.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 응답 헤더·오류 화면에 nginx 버전을 드러내지 않는다
    server_tokens off;

    # 글자 파일(JS·CSS·JSON)은 압축해서 보낸다 — 일지 데이터 344KB 가 60KB 안팎으로 준다.
    # 영상·그림은 이미 압축된 형식이라 넣지 않는다 (영상 건너뛰기용 Range 요청도 그대로 둔다)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # 방명록 글은 최대 2,000자라 요청 본문이 크지 않다
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;     # .env 의 TRUST_PROXY=1 과 짝
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # 발표 영상(수백 MB)을 건너뛰며 볼 수 있도록 Range 요청을 그대로 넘긴다
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;
        proxy_read_timeout 120s;
    }
}
