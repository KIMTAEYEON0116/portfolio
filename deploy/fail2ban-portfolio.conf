# /etc/fail2ban/filter.d/portfolio-abuse.conf — nginx access.log 에서 걸러낸다
[Definition]
# 404(없는 파일·.env 찔러보기), 429(속도 제한 초과), 403(차단된 관리자 API)
failregex = ^<HOST> - .* "(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS) [^"]*" (404|429|403) .*$
ignoreregex = ^<HOST> - .* "(GET|HEAD) /(favicon\.ico|robots\.txt|sitemap\.xml)[^"]*" 404 .*$
